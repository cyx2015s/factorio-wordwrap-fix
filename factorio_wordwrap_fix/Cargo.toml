[package]
name = "factorio_wordwrap_fix"
version = "0.1.0"
edition = "2024"
description = "Injected DLL: teach Factorio's word-wrap to break CJK (Chinese) text"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_SystemServices",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Threading",
] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"
# Native entry observation and the small boundary-block detour.
retour = "0.4.0-alpha.4"
# read factorio.pdb at runtime to locate multiMakeLinesStrView by symbol, so the
# patch point survives game updates without hardcoding a fresh RVA each time.
factorio-native-profile = { path = "../native-profile" }
unicode-linebreak = "0.1.5"
unicode-segmentation = "1.13"
